name: Auto Update VPN Subscriptions

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-vpn:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Sing-Box core (for URL-Test)
        run: |
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.10.7/sing-box-1.10.7-linux-amd64.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local/bin/ sing-box-1.10.7-linux-amd64/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      - name: Run Harvester
        run: |
          python main.py --no-push

      - name: Commit and push updated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Auto-update VPN subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
